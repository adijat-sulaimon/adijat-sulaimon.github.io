 d:{en:["Autonomous vehicles must cross a four-way intersection without collisions and without a traffic light. The intersection needs a controller that decides who goes next, and the vehicles need a way to ask for permission.","Real-time behaviour, collision avoidance, vehicle-to-infrastructure communication and a four-way layout. None of the team had used FreeRTOS before.","I worked from requirements down: requirement, use case, state machine, activity and sequence diagrams, so each design decision traced back to a requirement. I then turned the state machines into an abstract UPPAAL model of the vehicle and the intersection controller, with synchronised messages for connecting, queueing, passing and completion. The team implemented the controller’s queue as FreeRTOS tasks on an ESP32 and a 16-entry FIFO in VHDL, simulated in ModelSim.","The UPPAAL model covers a car arriving, connecting, queueing, crossing and reporting completion. UPPAAL’s deadlock check (A[] not deadlock) passed. On the ESP32, ten cars were queued and released in first-come-first-served order, shown in the serial monitor. In simulation, the VHDL FIFO returned data in the order it was written.","The prototype covers the queue only, and the wireless link is represented by serial output. Next: real vehicle-to-infrastructure communication over Wi-Fi, deadline-based priorities, and extending the UPPAAL model to several vehicles with clocks so that collision freedom can be checked."],
 de:["Autonome Fahrzeuge müssen eine Vier-Wege-Kreuzung ohne Kollisionen und ohne Ampel überqueren. Die Kreuzung braucht eine Steuerung, die entscheidet, wer als Nächstes fährt, und die Fahrzeuge brauchen eine Möglichkeit, um Erlaubnis zu fragen.","Echtzeitverhalten, Kollisionsvermeidung, Fahrzeug-zu-Infrastruktur-Kommunikation und eine Vier-Wege-Kreuzung. Niemand im Team hatte zuvor FreeRTOS genutzt.","Ich bin von den Anforderungen ausgegangen: Anforderungs-, Anwendungsfall-, Zustands-, Aktivitäts- und Sequenzdiagramme, sodass jede Entwurfsentscheidung auf eine Anforderung zurückführbar war. Daraus habe ich die Zustandsautomaten in ein abstraktes UPPAAL-Modell von Fahrzeug und Kreuzungssteuerung überführt, mit synchronisierten Nachrichten für Verbindung, Warteschlange, Freigabe und Abschluss. Das Team setzte die Warteschlange der Steuerung als FreeRTOS-Tasks auf einem ESP32 und als FIFO mit 16 Einträgen in VHDL um, simuliert in ModelSim.","Das UPPAAL-Modell deckt Ankunft, Verbindung, Warteschlange, Überfahrt und Abschlussmeldung eines Fahrzeugs ab. Die Deadlock-Prüfung in UPPAAL (A[] not deadlock) ist erfolgreich durchgelaufen. Auf dem ESP32 wurden zehn Fahrzeuge eingereiht und nach dem First-come-first-served-Prinzip freigegeben, sichtbar im Seriellmonitor. In der Simulation gab das VHDL-FIFO die Daten in der geschriebenen Reihenfolge zurück.","Der Prototyp deckt nur die Warteschlange ab, die Funkverbindung wird über die serielle Ausgabe dargestellt. Als Nächstes: echte Fahrzeug-zu-Infrastruktur-Kommunikation über WLAN, Prioritäten nach Deadline und ein UPPAAL-Modell mit mehreren Fahrzeugen und Uhren, um Kollisionsfreiheit prüfen zu können."]}};
