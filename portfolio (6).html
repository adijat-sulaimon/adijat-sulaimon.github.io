var CROSS={t:{en:"Autonomous cross-traffic management",de:"Autonomes Kreuzungsmanagement"},
 s:{en:"Design and verification of a first-come-first-served intersection controller for autonomous vehicles: UML design, an UPPAAL model and an ESP32 FreeRTOS prototype.",de:"Entwurf und Verifikation einer First-come-first-served-Kreuzungssteuerung für autonome Fahrzeuge: UML-Entwurf, UPPAAL-Modell und ESP32-FreeRTOS-Prototyp."},

 imgs:[{at:0,src:"img/cross-traffic-architecture.png",cap:{en:"System architecture: the intersection controller and each vehicle exchange messages over a wireless network. The vehicle adds radar and camera for its own obstacle sensing.",de:"Systemarchitektur: Kreuzungssteuerung und Fahrzeuge tauschen Nachrichten über ein drahtloses Netzwerk aus. Das Fahrzeug nutzt zusätzlich Radar und Kamera zur eigenen Hinderniserkennung."}},
 {at:2,src:"img/cross-traffic-state-machine.png",cap:{en:"State machines of vehicle (left) and ICS (right). Dashed arrows are the messages between them: directional signal, cross signal and completion signal.",de:"Zustandsautomaten von Fahrzeug (links) und ICS (rechts). Gestrichelte Pfeile sind die Nachrichten zwischen beiden: Richtungs-, Freigabe- und Abschlusssignal."}},
 {at:2,src:"img/cross-traffic-uppaal.png",cap:{en:"The same behaviour as an UPPAAL model: four processes that synchronise on channels such as connect, queue and pass_signal.",de:"Dasselbe Verhalten als UPPAAL-Modell: vier Prozesse, die sich über Kanäle wie connect, queue und pass_signal synchronisieren."}},
 {at:3,src:"img/cross-traffic-serial-monitor.png",cap:{en:"ESP32 serial monitor: each car is queued, receives a pass signal and reports completion, in arrival order.",de:"ESP32-Seriellmonitor: Jedes Fahrzeug wird eingereiht, erhält ein Freigabesignal und meldet den Abschluss, in Ankunftsreihenfolge."}},
 {at:3,src:"img/cross-traffic-modelsim.png",cap:{en:"ModelSim waveform: three 8-bit values written to the FIFO and read back in the same order.",de:"ModelSim-Wellenform: Drei 8-Bit-Werte werden ins FIFO geschrieben und in gleicher Reihenfolge wieder gelesen."}}],
 d:{en:["A four-way intersection without traffic lights needs a controller that lets autonomous vehicles cross without conflict. The goal was a vehicle-to-infrastructure design in which each car reports its direction to an intersection controller server (ICS) and crosses only after it is granted permission.","Real-time behaviour, collision avoidance as a hard requirement, wireless communication between vehicles and infrastructure, a four-way layout, and a scheduling rule that is predictable and easy to verify. We chose first come, first served for the first version. Nobody on the team had used FreeRTOS before.","I derived the design from a requirement hierarchy: the top-level requirement (control cross traffic autonomously) refined into safety, communication, four-way layout and real-time scheduling. From it I produced use case, state machine, activity and sequence diagrams for the vehicle and the ICS. The vehicle moves through arrival, connection, waiting, driving and completion. The ICS cycles through receiving, scheduling, decision and allowance, and selects the car with the earliest arrival. I translated these state machines into an abstract UPPAAL model in which vehicle and controller handshake over synchronised channels for connecting, queueing, passing and completion. The design also includes an extended version with track reservation and left, straight and right turns; the simpler FIFO variant was implemented. The team built the controller queue as two FreeRTOS tasks on an ESP32 (sender priority 2, receiver priority 1, queue depth 10) and as a 16-entry, 8-bit FIFO in VHDL, simulated in ModelSim.","The UPPAAL model covers a vehicle’s full cycle from arrival to completion and passes the deadlock check (A[] not deadlock). On the ESP32, ten cars were queued and released in strict arrival order, with pass and completion signals visible in the serial monitor. In ModelSim, the FIFO returned data in exactly the order it was written and signalled full and empty states with a flag.","The prototype covers the queue only. The wireless link is represented by serial messages, and the UPPAAL model has a single vehicle and no clocks. Next I would model several vehicles with timing in UPPAAL so that collision freedom can be checked, then replace the serial messages with real Wi-Fi communication and add deadline-based priorities."],
 de:["Eine Vier-Wege-Kreuzung ohne Ampel braucht eine Steuerung, die autonomen Fahrzeugen das Kreuzen ohne Konflikte ermöglicht. Ziel war ein Fahrzeug-zu-Infrastruktur-Entwurf, bei dem jedes Fahrzeug seine Fahrtrichtung an einen Kreuzungs-Controller-Server (ICS) meldet und die Kreuzung erst nach Freigabe überquert.","Echtzeitverhalten, Kollisionsvermeidung als harte Anforderung, drahtlose Kommunikation zwischen Fahrzeugen und Infrastruktur, eine Vier-Wege-Kreuzung und eine Scheduling-Regel, die vorhersagbar und gut überprüfbar ist. Für die erste Version haben wir First come, first served gewählt. Im Team hatte zuvor niemand FreeRTOS genutzt.","Ich habe den Entwurf aus einer Anforderungshierarchie abgeleitet: Die Hauptanforderung (Kreuzungsverkehr autonom steuern) wird in Sicherheit, Kommunikation, Vier-Wege-Layout und Echtzeit-Scheduling verfeinert. Daraus entstanden Anwendungsfall-, Zustands-, Aktivitäts- und Sequenzdiagramme für Fahrzeug und ICS. Das Fahrzeug durchläuft Ankunft, Verbindung, Warten, Fahrt und Abschluss. Der ICS durchläuft Empfang, Scheduling, Entscheidung und Freigabe und wählt das Fahrzeug mit der frühesten Ankunft. Die Zustandsautomaten habe ich in ein abstraktes UPPAAL-Modell übersetzt, in dem Fahrzeug und Controller über synchronisierte Kanäle für Verbindung, Warteschlange, Freigabe und Abschluss kommunizieren. Der Entwurf enthält außerdem eine erweiterte Version mit Spurreservierung sowie Links-, Geradeaus- und Rechtsfahrt; umgesetzt wurde die einfachere FIFO-Variante. Das Team realisierte die Warteschlange des Controllers als zwei FreeRTOS-Tasks auf einem ESP32 (Sender mit Priorität 2, Empfänger mit Priorität 1, Queue-Tiefe 10) und als FIFO mit 16 Einträgen zu je 8 Bit in VHDL, simuliert in ModelSim.","Das UPPAAL-Modell deckt den gesamten Ablauf eines Fahrzeugs von der Ankunft bis zum Abschluss ab und besteht die Deadlock-Prüfung (A[] not deadlock). Auf dem ESP32 wurden zehn Fahrzeuge eingereiht und strikt in Ankunftsreihenfolge freigegeben; Freigabe- und Abschlusssignale sind im Seriellmonitor sichtbar. In ModelSim gab das FIFO die Daten genau in der geschriebenen Reihenfolge zurück und meldete volle und leere Zustände über ein Flag.","Der Prototyp deckt nur die Warteschlange ab. Die Funkverbindung wird durch serielle Meldungen dargestellt, und das UPPAAL-Modell enthält ein einzelnes Fahrzeug und keine Uhren. Als Nächstes würde ich mehrere Fahrzeuge mit Zeitverhalten in UPPAAL modellieren, um Kollisionsfreiheit prüfen zu können, danach die seriellen Meldungen durch echte WLAN-Kommunikation ersetzen und Prioritäten nach Deadline ergänzen."]}};

 imgs:[{at:1,src:"img/rescue-robot-sketch.png",cap:{en:"Dimensioned sketch: the footprint is limited to 250 mm wide, while the length can grow to improve climbing.",de:"Bemaßte Skizze: Die Breite ist auf 250 mm begrenzt, die Länge darf zur besseren Kletterfähigkeit größer sein."}},
 {at:2,src:"img/rescue-robot-use-case.png",cap:{en:"Use case diagram: operator, environment and obstacles, with the burning-building and drowning scenarios.",de:"Anwendungsfalldiagramm: Bediener, Umgebung und Hindernisse mit den Szenarien Gebäudebrand und Ertrinken."}},
 {at:2,src:"img/rescue-robot-lower-body.png",cap:{en:"Lower body CAD model: houses the components and carries the track drive.",de:"CAD-Modell des Unterbaus: nimmt die Komponenten auf und trägt den Kettenantrieb."}},
 {at:2,src:"img/rescue-robot-bfs-activity.png",cap:{en:"Activity diagram of the breadth-first path search, modelled before coding.",de:"Aktivitätsdiagramm der Breitensuche, vor der Implementierung modelliert."}},
 {at:3,src:"img/rescue-robot-final-model.png",cap:{en:"Final CAD assembly of the robot.",de:"Fertige CAD-Baugruppe des Roboters."}},
 {at:3,src:"img/rescue-robot-prototype.jpg",cap:{en:"The 3D-printed prototype.",de:"Der 3D-gedruckte Prototyp."}}],
 d:{en:["Rescuers in burning buildings or at drowning scenes face danger, and human error under stress. The aim was a robot that moves on land and on water, finds people and fire, and supports the rescue team without putting more lives at risk.","A footprint of at most 250 mm wide (the length could be greater for climbing), operation on rough terrain and in water, limited battery power (NiMH or NiCd), and tools to break windows and launch a life buoy. Navigation was developed and run in a computer simulation, with a limit of 200 steps per map.","We worked top-down: SysML and UML diagrams first (requirements, use cases, sequence diagrams for both scenarios, a layered architecture), then mechanical design, then software. I took part in the diagrams, including the use case diagram that fixes the system boundary and the two scenarios. I did the SolidWorks design: every part, from the lower body that houses the components and carries the drive to the final assembly. For the drive, we compared options and chose rotating continuous tracks for traction on slippery ground, rough terrain and power efficiency. The software is a C navigation function on a grid map, built in four tasks: directional movement around walls, switching between land and water movement, shortest-path search with breadth-first search (BFS) including the way back, and destroying obstacles. I contributed to the code. Each task was modelled as an activity diagram before coding. Costs were 10 for a move, 30 for a change of method and 70 for destroying an obstacle.","Four navigation behaviours implemented in C, and a complete design package from requirements to a CAD assembly of the whole robot: body, tracks, gears, belt, propeller, life buoy launcher and breaker tool. The design was built as a 3D-printed prototype. In Task 4 the robot deliberately takes the shortest path over low energy use and destroys obstacles in its way.","The navigation was developed in simulation on known grid maps. BFS minimises the number of steps, not the energy; with the costs we defined, Dijkstra or A* would find the cheapest route. Next I would test the navigation on the printed prototype with real sensors."],
 de:["Einsatzkräfte in brennenden Gebäuden oder bei Ertrinkenden sind Gefahren und menschlichen Fehlern unter Stress ausgesetzt. Ziel war ein Roboter, der sich an Land und im Wasser bewegt, Menschen und Feuer findet und das Rettungsteam unterstützt, ohne weitere Leben zu gefährden.","Eine Breite von höchstens 250 mm (die Länge durfte größer sein, um besser zu klettern), Einsatz auf rauem Gelände und im Wasser, begrenzte Akkuleistung (NiMH oder NiCd) sowie Werkzeuge zum Einschlagen von Fenstern und zum Abschießen einer Rettungsboje. Die Navigation wurde in einer Computersimulation entwickelt und ausgeführt, mit einer Grenze von 200 Schritten pro Karte.","Wir sind von oben nach unten vorgegangen: zuerst SysML- und UML-Diagramme (Anforderungen, Anwendungsfälle, Sequenzdiagramme für beide Szenarien, eine Schichtenarchitektur), dann die mechanische Konstruktion, dann die Software. Ich habe an den Diagrammen mitgewirkt, darunter das Anwendungsfalldiagramm, das die Systemgrenze und die beiden Szenarien festlegt. Die SolidWorks-Konstruktion habe ich übernommen: jedes Einzelteil, vom Unterbau, der die Komponenten aufnimmt und den Antrieb trägt, bis zur fertigen Baugruppe. Für den Antrieb haben wir Optionen verglichen und uns für umlaufende Ketten entschieden, wegen Traktion auf rutschigem Untergrund, rauem Gelände und Energieeffizienz. Die Software ist eine Navigationsfunktion in C auf einer Rasterkarte, in vier Aufgaben umgesetzt: Bewegung in Himmelsrichtungen um Wände herum, Wechsel zwischen Land- und Wasserbewegung, kürzeste Wegsuche mit Breitensuche (BFS) samt Rückweg und das Zerstören von Hindernissen. Am Code habe ich mitgearbeitet. Jede Aufgabe wurde vor dem Programmieren als Aktivitätsdiagramm modelliert. Die Kosten betrugen 10 für einen Schritt, 30 für einen Methodenwechsel und 70 für das Zerstören eines Hindernisses.","Vier in C umgesetzte Navigationsverhalten und ein vollständiges Entwurfspaket von den Anforderungen bis zur CAD-Baugruppe des gesamten Roboters: Karosserie, Ketten, Zahnräder, Riemen, Propeller, Rettungsbojen-Werfer und Brechwerkzeug. Der Entwurf wurde als 3D-gedruckter Prototyp gebaut. In Aufgabe 4 wählt der Roboter bewusst den kürzesten Weg statt geringen Energieverbrauchs und zerstört Hindernisse auf seinem Weg.","Die Navigation wurde in der Simulation auf bekannten Rasterkarten entwickelt. BFS minimiert die Anzahl der Schritte, nicht die Energie; mit den von uns definierten Kosten würde Dijkstra oder A* die günstigste Route finden. Als Nächstes würde ich die Navigation am gedruckten Prototyp mit echten Sensoren testen."]}};
var TRUCK={t:{en:"Truck platoon coordination system",de:"Koordinationssystem für Lkw-Kolonnen"},
 s:{en:"A distributed leader-follower truck platoon in C++ with TCP/IP communication that opens a gap when a car wants to pass, with a GPU distance check, an Arduino simulation and a schedulability analysis.",de:"Eine verteilte Leader-Follower-Lkw-Kolonne in C++ mit TCP/IP-Kommunikation, die eine Lücke öffnet, wenn ein Pkw durchfahren will, mit GPU-Abstandsprüfung, Arduino-Simulation und Schedulability-Analyse."},
 tags:["C++","TCP/IP","CUDA","Arduino","RMS scheduling","SysML / UML"],media:{src:"",poster:""},code:"https://github.com/ESE-Semester-Project-Team-1/ESE-Group-1",
 role:{en:"Team project (4 people). My part: the scheduling analysis and the GPU acceleration, the requirement and parametric constraint diagrams, and review of the sequence and internal block diagrams.",de:"Teamprojekt (4 Personen). Mein Anteil: Scheduling-Analyse und GPU-Beschleunigung, Anforderungs- und parametrisches Constraint-Diagramm sowie die Prüfung von Sequenz- und internem Blockdiagramm."},
 imgs:[{at:2,src:"img/truck-platoon-state-machine.png",cap:{en:"State machine of the platoon: driving, increase distance, car passing, reduce distance.",de:"Zustandsautomat der Kolonne: Fahren, Abstand vergrößern, Pkw passiert, Abstand verkleinern."}},
 {at:2,src:"img/truck-platoon-node-architecture.png",cap:{en:"Node architecture: communication layer, message queue and behaviour controller in every entity.",de:"Knotenarchitektur: Kommunikationsschicht, Nachrichtenwarteschlange und Verhaltenssteuerung in jeder Einheit."}},
 {at:3,src:"img/truck-platoon-comm-output.png",cap:{en:"Console output of car, follower and leader: request, increase distance, confirmation, safe to pass.",de:"Konsolenausgabe von Pkw, Follower und Leader: Anfrage, Abstand vergrößern, Bestätigung, Durchfahrt frei."}},
 {at:3,src:"img/truck-platoon-tinkercad.png",cap:{en:"Tinkercad simulation: Arduino Uno, ultrasonic sensor, motor driver and DC motor.",de:"Tinkercad-Simulation: Arduino Uno, Ultraschallsensor, Motortreiber und Gleichstrommotor."}},
 {at:3,src:"img/truck-platoon-scheduling.png",cap:{en:"Scheduling analysis: total utilisation 0.733, below the RMS bound of 0.779.",de:"Scheduling-Analyse: Gesamtauslastung 0,733, unter der RMS-Grenze von 0,779."}}],
 d:{en:["In a truck platoon, the trucks drive close together to save fuel, but other cars sometimes need to pass between them. The platoon has to open a gap safely, hold it while the car passes, and close it again, using only messages between the trucks and the car.","A minimum safe distance of 20 m, decisions within 300 ms, bounded message size and latency, and communication overhead that stays low as trucks are added. I defined these as constraints in the parametric diagram. Messages had to arrive reliably in the prototype, so we chose TCP/IP over UDP.","The design came first: SysML and UML models (requirements, three use cases, sequence, block, state machine, activity and internal block diagrams, plus the constraints above). I made the requirement and parametric constraint diagrams. The platoon follows a four-state cycle: driving, increase distance, car passing, reduce distance. For the implementation we wrote C++ socket programs for leader, follower and car. Each entity runs three threads (receiver, transmitter, behaviour controller) connected by message queues, and messages are serialised objects with an ID, timestamp, validity flag and a matrix clock for causality. The leader has separate V2X and V2P ports and queues, so cars cannot reach the platoon channel. I did the GPU acceleration: a CUDA kernel that checks the distance matrix between trucks for violations. We simulated the sensing and following behaviour on an Arduino Uno in Tinkercad with an ultrasonic sensor and a DC motor. I did the scheduling analysis, using Rate Monotonic Scheduling to check that the three tasks meet their deadlines.","In the console demo, the car’s request reached the leader, the follower increased its distance and confirmed, and the leader told the car it was safe to pass; invalid messages were rejected. All seven unit tests passed (serialisation, deserialisation, transmitter, receiver and the three behaviour controllers). In the Tinkercad simulation, the follower increased its distance when a car came within 20 inches and went back to normal spacing after it passed. The scheduling analysis gave a total utilisation of 0.733, below the 0.779 bound for three tasks, so the task set is schedulable under RMS. The GPU distance check took 124.59 ms on the first run and 0.17 ms on the second.","We built the communication, scheduling and detection parts, not the full platoon, and the trucks are simulated, not physical. Fault handling (heartbeat timeouts, a fail-safe mode, communication and sensor recovery, and an emergency brake) was designed as a UML state machine but not implemented. The sequence ends when the car is told it may pass; the message after it has passed and closing the gap again are still to do. The GPU kernel is oversized for a five-truck matrix, and the first-run time is mostly start-up cost, so it would pay off only at larger scale. Next I would run the nodes on real hardware over a wireless link."],
 de:["In einer Lkw-Kolonne fahren die Fahrzeuge dicht hintereinander, um Kraftstoff zu sparen, doch manchmal muss ein Pkw zwischen ihnen hindurch. Die Kolonne muss sicher eine Lücke öffnen, sie halten, solange der Pkw durchfährt, und sie wieder schließen, allein über Nachrichten zwischen den Lkw und dem Pkw.","Ein Mindestabstand von 20 m, Entscheidungen innerhalb von 300 ms, begrenzte Nachrichtengröße und Latenz sowie ein geringer Kommunikationsaufwand, auch wenn weitere Lkw hinzukommen. Diese Vorgaben habe ich im parametrischen Diagramm als Constraints definiert. Nachrichten mussten im Prototyp zuverlässig ankommen, daher wählten wir TCP/IP statt UDP.","Zuerst kam der Entwurf: SysML- und UML-Modelle (Anforderungen, drei Anwendungsfälle, Sequenz-, Block-, Zustands-, Aktivitäts- und internes Blockdiagramm sowie die genannten Constraints). Ich habe das Anforderungsdiagramm und das parametrische Constraint-Diagramm erstellt. Die Kolonne durchläuft einen Zyklus aus vier Zuständen: Fahren, Abstand vergrößern, Pkw passiert, Abstand verkleinern. Für die Umsetzung schrieben wir C++-Socket-Programme für Leader, Follower und Pkw. Jede Einheit führt drei Threads aus (Empfänger, Sender, Verhaltenssteuerung), die über Nachrichtenwarteschlangen verbunden sind. Nachrichten sind serialisierte Objekte mit ID, Zeitstempel, Gültigkeitsflag und einer Matrixuhr für die Kausalität. Der Leader hat getrennte V2X- und V2P-Ports und -Warteschlangen, damit Pkw keinen Zugriff auf den Kolonnenkanal haben. Die GPU-Beschleunigung habe ich umgesetzt: Ein CUDA-Kernel prüft die Abstandsmatrix der Lkw auf Verletzungen. Die Sensorik und das Folgeverhalten haben wir auf einem Arduino Uno in Tinkercad mit Ultraschallsensor und Gleichstrommotor simuliert. Die Scheduling-Analyse habe ich durchgeführt: Mit Rate Monotonic Scheduling habe ich geprüft, ob die drei Tasks ihre Deadlines einhalten.","In der Konsolen-Demo erreichte die Anfrage des Pkw den Leader, der Follower vergrößerte seinen Abstand und bestätigte dies, und der Leader teilte dem Pkw mit, dass er passieren kann; ungültige Nachrichten wurden abgelehnt. Alle sieben Tests (Serialisierung, Deserialisierung, Sender, Empfänger und die drei Verhaltenssteuerungen) waren erfolgreich. In der Tinkercad-Simulation vergrößerte der Follower den Abstand, sobald ein Pkw näher als 20 Zoll kam, und kehrte nach der Durchfahrt zum normalen Abstand zurück. Die Scheduling-Analyse ergab eine Gesamtauslastung von 0,733 und liegt damit unter der Grenze von 0,779 für drei Tasks; die Taskmenge ist unter RMS also planbar. Die GPU-Abstandsprüfung dauerte beim ersten Lauf 124,59 ms und beim zweiten 0,17 ms.","Wir haben Kommunikation, Scheduling und Erkennung umgesetzt, nicht die gesamte Kolonne, und die Lkw sind simuliert, nicht physisch. Die Fehlerbehandlung (Heartbeat-Timeouts, ein Fail-safe-Modus, Wiederherstellung von Kommunikation und Sensorik sowie eine Notbremsung) wurde als UML-Zustandsautomat entworfen, aber nicht umgesetzt. Die Sequenz endet, sobald der Pkw die Freigabe erhält; die Meldung nach der Durchfahrt und das Schließen der Lücke stehen noch aus. Der GPU-Kernel ist für eine Matrix mit fünf Lkw überdimensioniert, und die Zeit des ersten Laufs ist vor allem Startaufwand; er lohnt sich erst in größerem Maßstab. Als Nächstes würde ich die Knoten auf echter Hardware über eine Funkverbindung betreiben."]}};
var SUGAR={t:{en:"Smart labeling of sugar beet plants with active learning",de:"Intelligentes Labeling von Zuckerrübenpflanzen mit Active Learning"},
 s:{en:"Bachelor thesis: active learning with a ResNet50 to label drone images of sugar beet growth stages, starting from about 10% labelled data and reaching about 99% accuracy on a separate test set.",de:"Bachelorarbeit: Active Learning mit einem ResNet50 zum Labeln von Drohnenbildern von Zuckerrüben-Wachstumsstadien, ausgehend von etwa 10 % gelabelten Daten, mit rund 99 % Genauigkeit auf einem separaten Testsatz."},
 tags:["Active learning","ResNet50","PyTorch","Uncertainty sampling","Computer vision"],media:{src:"",poster:""},code:"https://github.com/adijat-sulaimon/Labeling-using-Active-Learning",
 role:{en:"Individual project (bachelor thesis, Hochschule Hamm-Lippstadt). I built the active learning pipeline, trained the models and analysed the results.",de:"Einzelprojekt (Bachelorarbeit, Hochschule Hamm-Lippstadt). Ich habe die Active-Learning-Pipeline aufgebaut, die Modelle trainiert und die Ergebnisse analysiert."},
 imgs:[{at:2,src:"img/sugarbeet-uncertain-samples.png",cap:{en:"Images the model was least sure about, selected for labelling in one round.",de:"Bilder, bei denen sich das Modell am unsichersten war und die in einer Runde zum Labeln ausgewählt wurden."}},
 {at:3,src:"img/sugarbeet-confusion-matrix.png",cap:{en:"Confusion matrix on a separate test set: almost all errors are between sugar beet stages 1 and 2.",de:"Konfusionsmatrix auf einem separaten Testsatz: Fast alle Fehler liegen zwischen Zuckerrüben-Stadium 1 und 2."}},

 d:{en:["Weed control in sugar beet fields depends on recognising the crop reliably, but labelling enough training images by hand is slow and costly, while unlabelled drone footage is plentiful. The goal was high recognition accuracy while labelling as few images as possible.","A small labelled set: about 10% of each class (200 of 1,700 stage 1 images, 250 of 2,557 stage 2 images and 120 of 1,102 apple images). The sugar beet images were recorded by a drone at 1 to 3 m height on two days in May 2023 over a field near Erftstadt, and the two growth stages look alike. The apple class comes from the public PlantVillage dataset. The sugar beet data is private.","I built the pipeline in three steps. First, a binary ResNet50 classifier for sugar beet stage 1 versus stage 2, trained with a learning-rate warm-up and decay schedule. Then pool-based uncertainty sampling: the model listed the images it was least sure about (over 100), 50 of them were selected for labelling and moved into the training set, and the model was retrained, for two rounds. Finally, I extended it to three classes (sugar beet stage 1, stage 2 and apple) with batch-mode sampling and a batch size of 100, so that several uncertain images are labelled per round instead of one at a time. I evaluated on a separate dataset with a confusion matrix and inspected the wrong predictions.","On a separate test set of 3,102 images, 3,076 were classified correctly, about 99%. Most of the 26 errors were between the two sugar beet stages (7 of 726 stage 1 images and 18 of 731 stage 2 images), plus one apple image. Looking at the wrong predictions showed that most were blurry. Accuracy improved with each uncertainty sampling round.","The thesis does not compare against random sampling, so the label saving is not quantified. A random-sampling baseline with the same labelling budget, and a learning curve of accuracy against number of labels, would show how much active learning really saves. Apple is easy to separate from sugar beet, so the stage 1 versus stage 2 result is the meaningful one. Next I would test margin and entropy sampling, which the thesis describes, and filter out blurry frames before labelling."],
 de:["Die Unkrautbekämpfung auf Zuckerrübenfeldern setzt voraus, dass die Kulturpflanze zuverlässig erkannt wird. Genug Trainingsbilder von Hand zu labeln ist jedoch langsam und teuer, während ungelabeltes Drohnenmaterial reichlich vorhanden ist. Ziel war eine hohe Erkennungsgenauigkeit bei möglichst wenigen gelabelten Bildern.","Ein kleiner gelabelter Datensatz: etwa 10 % jeder Klasse (200 von 1.700 Bildern für Stadium 1, 250 von 2.557 für Stadium 2 und 120 von 1.102 Apfelbildern). Die Zuckerrübenbilder wurden im Mai 2023 an zwei Tagen mit einer Drohne in 1 bis 3 m Höhe über einem Feld bei Erftstadt aufgenommen, und die beiden Wachstumsstadien sehen sich ähnlich. Die Apfelklasse stammt aus dem öffentlichen PlantVillage-Datensatz. Die Zuckerrübendaten sind nicht öffentlich.","Ich habe die Pipeline in drei Schritten aufgebaut. Zuerst ein binärer ResNet50-Klassifikator für Zuckerrübe Stadium 1 gegen Stadium 2, trainiert mit einem Learning-Rate-Schedule aus Warm-up und Abklingen. Dann pool-basiertes Uncertainty Sampling: Das Modell listete die Bilder auf, bei denen es sich am unsichersten war (über 100), 50 davon wurden zum Labeln ausgewählt und in den Trainingssatz verschoben, danach wurde das Modell neu trainiert, in zwei Runden. Schließlich habe ich es auf drei Klassen (Zuckerrübe Stadium 1, Stadium 2 und Apfel) mit Batch-Mode-Sampling und einer Batchgröße von 100 erweitert, sodass pro Runde mehrere unsichere Bilder gelabelt werden statt einzeln. Ausgewertet habe ich auf einem separaten Datensatz mit einer Konfusionsmatrix und habe die Fehlvorhersagen untersucht.","Auf einem separaten Testsatz mit 3.102 Bildern wurden 3.076 korrekt klassifiziert, rund 99 %. Die meisten der 26 Fehler lagen zwischen den beiden Zuckerrüben-Stadien (7 von 726 Bildern aus Stadium 1 und 18 von 731 aus Stadium 2), dazu ein Apfelbild. Die Fehlvorhersagen waren überwiegend unscharfe Bilder. Die Genauigkeit stieg mit jeder Uncertainty-Sampling-Runde.","Die Arbeit vergleicht nicht mit zufälliger Auswahl, daher ist die Label-Einsparung nicht beziffert. Eine Baseline mit zufälliger Auswahl bei gleichem Label-Budget und eine Lernkurve der Genauigkeit über der Anzahl der Labels würden zeigen, wie viel Active Learning wirklich spart. Apfel lässt sich leicht von Zuckerrübe trennen, daher ist das Ergebnis für Stadium 1 gegen Stadium 2 das aussagekräftige. Als Nächstes würde ich Margin- und Entropy-Sampling testen, die die Arbeit beschreibt, und unscharfe Frames vor dem Labeln herausfiltern."]}};
